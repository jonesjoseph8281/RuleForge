[project]
name = "ruleforge"
version = "0.1.0"
description = "Rule engine and LLM platform for MEP designs"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-smorest>=0.42.0",
    "flask-jwt-extended>=4.6.0",
    "flask-limiter>=3.7.0",
    "flask-cors>=4.0.0",
    "pydantic>=2.7.0",
    "celery>=5.4.0",
    "redis>=5.0.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "langgraph>=0.0.35",
    "langchain-core>=0.1.42",
    "tenacity>=8.2.3",
    "scikit-learn>=1.4.2",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "joblib>=1.4.0",
    "sentence-transformers>=2.7.0",
    "structlog>=24.1.0",
    "gunicorn>=22.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0"
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
